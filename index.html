<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jurassic Bubble Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.16.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.16.1/mapbox-gl.js"></script>

  <!-- Firebase (v9 modular) -->
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Map -->
  <div id="map"></div>

  <!-- Grid overlay -->
  <div class="grid-overlay"></div>

  <!-- HUD overlay -->
  <div class="hud-overlay">
    <div class="hud-title">
      JURASSIC BUBBLE TRACKER
      <span class="hud-subtitle blink">LIVE</span>
    </div>

    <div class="hud-panel">
      <h2>Bubble Members</h2>
      <div class="hud-panel-subtitle">Shared location group</div>
      <ul id="target-list"></ul>
    </div>

    <div class="hud-controls">
      <button id="join-bubble-btn">Join Bubble</button>
      <button id="leave-bubble-btn">Leave Bubble</button>
    </div>

    <div class="hud-status" id="status">
      SYSTEM BOOT: Awaiting user action...
    </div>
  </div>

  <!-- Config + app -->
  <script type="module">
    // ====== CONFIG PLACEHOLDERS ======
    // 1) Mapbox
    window.MAPBOX_TOKEN = "YOUR_MAPBOX_ACCESS_TOKEN_HERE";

    // 2) Firebase
    window.FIREBASE_CONFIG = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 3) Bubble ID (everyone using same ID shares a map)
    window.BUBBLE_ID = "main-bubble";
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
