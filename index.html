<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jurassic Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.16.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.16.1/mapbox-gl.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hud-overlay">
    <div class="hud-title">JURASSIC TRACKER</div>
    <div class="hud-panel">
      <h2>Active Targets</h2>
      <ul id="target-list">
        <!-- Filled by JS -->
      </ul>
    </div>
    <div class="hud-status" id="status">Awaiting location permission...</div>
  </div>

  <div id="map"></div>

  <script>
    // TODO: replace with your Mapbox token
    window.MAPBOX_TOKEN = "YOUR_MAPBOX_ACCESS_TOKEN_HERE";
  </script>
  <script src="app.js"></script>
</body>
</html>
